<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#3fce8f" stop-opacity="0.16"/><stop offset="1" stop-color="#3fce8f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1d2a22"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0d0b"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1d2a22"/>

  <!-- logo mark: terminal prompt -->
  <g transform="translate(80,72)">
    <rect x="1" y="1" width="52" height="52" rx="14" fill="none" stroke="#3fce8f" stroke-width="2.4" stroke-opacity="0.35"/>
    <path d="M16 19 L25 27 L16 35" fill="none" stroke="#3fce8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="29" y="33" width="12" height="4" rx="2" fill="#3fce8f"/>
  </g>
  <text x="152" y="107" fill="#d8e2dc" font-size="29" font-weight="700">free-llm-api-hub</text>

  <!-- headline -->
  <text x="80" y="252" fill="#d8e2dc" font-size="72" font-weight="700" letter-spacing="-2">Free LLM APIs you can</text>
  <text x="80" y="338" fill="#d8e2dc" font-size="72" font-weight="700" letter-spacing="-2">actually <tspan fill="#3fce8f">build on</tspan>.</text>

  <text x="82" y="404" fill="#808f87" font-size="27">LLM · image · speech · embeddings · OCR — verified, dated, machine-readable.</text>

  <!-- stat chips -->
  <g font-weight="700">
    <rect x="80" y="470" width="290" height="72" rx="12" fill="#0f1512" stroke="#1d2a22"/>
    <text x="104" y="507" fill="#3fce8f" font-size="34">47</text>
    <text x="104" y="530" fill="#808f87" font-size="17" font-weight="400">model APIs tracked</text>

    <rect x="392" y="470" width="290" height="72" rx="12" fill="#0f1512" stroke="#1d2a22"/>
    <text x="416" y="507" fill="#3fce8f" font-size="34">100%</text>
    <text x="416" y="530" fill="#808f87" font-size="17" font-weight="400">independently verified</text>

    <rect x="704" y="470" width="416" height="72" rx="12" fill="#0f1512" stroke="#1d2a22"/>
    <text x="728" y="505" fill="#d8e2dc" font-size="22">no card · no phone · OpenAI-compat</text>
    <text x="728" y="530" fill="#808f87" font-size="17" font-weight="400">filter by what you actually need</text>
  </g>

  <text x="80" y="590" fill="#56655c" font-size="21">freellmapihub.com</text>
</svg>
