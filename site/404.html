<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Free LLM API Hub</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" href="/free-llm-api-hub/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/free-llm-api-hub/fonts/jetbrains-mono-700.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#0a0d0b">
<link rel="stylesheet" href="/free-llm-api-hub/styles.css">
<style>
  .nf { min-height: 62vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 0; }
  .nf .code { font-family: var(--font-mono); font-weight: 700; font-size: clamp(4rem, 16vw, 9rem); line-height: 1; color: var(--accent); letter-spacing: -.04em; }
  .nf .msg { font-family: var(--font-mono); color: var(--muted); margin: 10px 0 4px; }
  .nf .msg .path { color: var(--text); }
  .nf p { color: var(--muted); max-width: 46ch; margin: 8px auto 26px; }
  .nf .cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="logo" viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" rx="8" stroke="currentColor" stroke-width="2" stroke-opacity=".35"/><path d="M9 11 L14 16 L9 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="16.5" y="19.4" width="7" height="2.4" rx="1.2" fill="currentColor"/></symbol>
</defs></svg>

<header class="site-header"><div class="wrap header-inner">
  <a class="brand" href="/free-llm-api-hub/" aria-label="Free LLM API Hub — home">
    <svg class="logo-mark"><use href="#logo"/></svg>
    <span class="brand-name">Free LLM API <span class="grad">Hub</span></span>
  </a>
  <div class="header-actions">
    <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme" title="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</div></header>

<main class="wrap nf">
  <div class="code">404</div>
  <p class="msg">&gt; command not found: <span class="path" id="path">/…</span></p>
  <p>That page isn't part of the dataset. It may have moved, or never existed. The data, though, is very much alive.</p>
  <div class="cta">
    <a class="btn primary" href="/free-llm-api-hub/">← Back home</a>
    <a class="btn ghost" href="/free-llm-api-hub/#explorer">Browse providers</a>
    <a class="btn ghost" href="/free-llm-api-hub/collections/">Collections</a>
  </div>
</main>

<footer class="site-footer"><div class="wrap footer-bottom">
  Independent, community-maintained — <a href="https://github.com/pacocartones/free-llm-api-hub">github.com/pacocartones/free-llm-api-hub</a>
</div></footer>

<script>try{document.getElementById('path').textContent=location.pathname.replace('/free-llm-api-hub','')||'/';}catch(e){}</script>
<script src="/free-llm-api-hub/site.js"></script>
</body>
</html>
