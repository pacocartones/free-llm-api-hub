language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # The maintainers' own pull requests are not reviewed automatically; every pull request
    # from an outside contributor still is (owner's decision, 2026-10-17).
    ignore_usernames:
      - pacocartones
  path_filters:
    - "!data/**"
    - "!dist/**"
    - "!**/*.min.js"
  path_instructions:
    - path: "**/*.mjs"
      instructions: >
        This project derives the site and docs from data/ via build.mjs (single-source
        doctrine). Flag any hand-maintained value that duplicates something derivable
        from the data, and any change to generated output that should instead change
        the generator or the source data.
chat:
  auto_reply: true

# No issue-enrichment comments ("Related PRs", "Similar issues", auto-plans)
# on new issues: this tracker is organized as umbrellas + per-provider
# good-first-issues that carry their own instructions, and the auto comments
# are noise against 78 generated issues. PR reviews stay fully enabled.
issue_enrichment:
  auto_enrich:
    enabled: false
