language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Both maintainers' pull requests are excluded from automatic review;
    # outside contributors remain eligible.
    ignore_usernames:
      - pacocartones
      - LeonMAG
    # Data pull requests ("data: …", "data(provider): …") change data/, which is
    # never reviewed here (see path_filters), plus regenerated files and the
    # changelog. A bot thread on those blocks the merge, because main requires
    # every conversation to be resolved, without adding a useful review. People
    # review data PRs against the sources; `@coderabbitai review` still works.
    ignore_title_keywords:
      - "data:"
      - "data("
  # Not reviewed: the dataset, and generated files that carry no authored text
  # (site/index.html and README.md keep authored text, so they stay reviewed;
  # a comment on generated output belongs on its generator or source data).
  path_filters:
    - "!data/**"
    - "!dist/**"
    - "!**/*.min.js"
    - "!site/**/*.json"
    - "!site/**/*.csv"
    - "!site/**/*.xml"
    - "!site/og/**"
    - "!collections/**"
    - "!CITATION.cff"
    - "!derived-fingerprints.json"
    - "!badge-*.json"
  path_instructions:
    - path: "**/*.mjs"
      instructions: >
        This project derives the site and docs from data/ via build.mjs (single-source
        doctrine). Flag any hand-maintained value that duplicates something derivable
        from the data, and any change to generated output that should instead change
        the generator or the source data.
chat:
  auto_reply: true

# No issue-enrichment comments ("Related PRs", "Similar issues", auto-plans)
# on new issues: this tracker is organized as umbrellas + per-provider
# good-first-issues that carry their own instructions, and the auto comments
# are noise against 78 generated issues. PR reviews stay fully enabled.
issue_enrichment:
  auto_enrich:
    enabled: false
