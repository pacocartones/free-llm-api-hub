# The shipped site has zero runtime dependencies. Keep the root development
# tooling, MCP package, Lighthouse tooling and pinned GitHub Actions current.
#
# Every Dependabot PR pays the full PR gate and, with strict up-to-date checks,
# an "update branch" after each merge, so updates are batched:
#   - one weekly PR for all GitHub Actions;
#   - one weekly PR for every npm minor and patch update across the three
#     lockfiles (/, /packages/mcp, /tools/lighthouse). Lighthouse rides in the
#     same PR, so it adds no PR of its own; one entry has one schedule, so it
#     cannot be monthly while it shares the group;
#   - a major npm update gets its own PR, so a breaking change is reviewed alone.
# cooldown: a release is only proposed once it is at least seven days old, so a
# compromised or yanked version has time to be caught upstream first. Security
# updates are not grouped and do not wait for the schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /
      - /packages/mcp
      - /tools/lighthouse
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
