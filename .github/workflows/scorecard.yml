name: OpenSSF Scorecard

on:
  # Weekly. It used to run on every push to main as well (about 270 runs), but the score
  # only moves with settings and workflows, which the weekly run and the branch_protection_rule
  # trigger below already cover; run it by hand after a security-relevant change.
  schedule:
    - cron: "27 4 * * 1"
  # Re-run on changes to branch protection, which Scorecard scores.
  branch_protection_rule:
  workflow_dispatch:

# Read-only at workflow level; the Scorecard job gets the two write scopes it needs.
# Publishing requires no top-level env, defaults or write permissions.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to code scanning.
      security-events: write
      # OIDC token that authenticates the published results (badge and public API).
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
