name: Credential probe

# The credential half of verification: call each provider's /models endpoint
# with a real key and record the result (probe_status + last_probed), independent
# of docs-based `verified`. A full inference probe remains a separate, explicit
# operation, so the site never treats an auth check as proof that inference works.
# Runs Mondays 09:00 UTC, one hour after maintenance.yml, so the two never race.
#
# Mode: --auth-only. One /models call per provider, no inference — near-zero
# footprint, burns no free quota. A full inference probe stays a local ritual:
#   GROQ_API_KEY=... node scripts/probe.mjs --write
#
# Keys come from repo secrets (Settings → Secrets and variables → Actions).
# probe.mjs reads process.env[env_key] and SKIPS any provider whose secret is
# unset, so this workflow is a safe no-op until secrets exist. Add a secret,
# and that provider joins the probe on the next run — no code change needed.
# Keys are used only in Authorization headers; never logged, never written.
#
# Delivery: probe results are delivered as a pull request (bot/probe → main),
# never a direct push. main requires the "Dataset integrity" status check, and a
# direct push with [skip ci] cannot report it (GH006) — same trust model as
# maintenance.yml and regenerate.yml (fixed 2026-08-11).
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write   # commit probe results to bot/probe
  pull-requests: write # gh pr create/view on bot/probe

concurrency:
  group: live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.mjs derives per-provider history from git log
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Probe providers whose key is present
        env:
          # Free-tier keys, all obtainable without a credit card. Create any
          # subset; missing ones are simply skipped.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node scripts/probe.mjs --auth-only --write

      - name: Validate and rebuild derived files
        run: |
          node scripts/validate.mjs
          node scripts/build.mjs

      # Deliver any probe results as a pull request (bot/probe → main).
      - name: Open or update a probe pull request
        env:
          # A PAT bypasses GitHub's "Allow GitHub Actions to create and approve
          # pull requests" restriction (off by default; Settings → Actions →
          # General). Without one, GITHUB_TOKEN works only once that setting is
          # enabled; otherwise the branch is pushed and an actionable warning
          # explains what to do instead of failing cryptically.
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          # Guard first: with no secrets set, every provider comes back
          # `skipped-no-key` and the only diff is the date bump in the report.
          # Committing that weekly would dress a no-op up as a verification.
          probed=$(node -p "JSON.parse(require('node:fs').readFileSync('data/probe-report.json','utf8')).results.filter(r => r.status !== 'skipped-no-key').length")
          if [ "$probed" -eq 0 ]; then
            echo "::warning title=Credential probe is a no-op::No API keys are configured as repository secrets, so all providers were skipped. probe_status stays null. See docs/live-testing.md."
            exit 0
          fi

          if git diff --quiet; then
            echo "Probe results unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/probe
          git add -A
          git commit -m "data: weekly credential probe ($probed provider(s))"
          git push --force origin bot/probe
          # gh pr view does not filter by state: a previously merged bot/probe
          # PR would make it look "already open". Ask for the state explicitly and
          # only treat an OPEN PR as the branch's existing PR.
          if gh pr view bot/probe --repo "$GITHUB_REPOSITORY" --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            echo "Probe PR already open — branch updated."
          elif gh pr create --repo "$GITHUB_REPOSITORY" --base main --head bot/probe \
            --title "data: weekly credential probe ($probed provider(s))" \
            --body "Weekly credential probe run (auth-only). The required checks run on this PR; merge when green."; then
            echo "Probe PR created."
          else
            echo "::warning::bot/probe was pushed but the PR could not be created. Enable \"Allow GitHub Actions to create and approve pull requests\" (Settings → Actions → General) or add a GH_PAT secret (repo scope); either way the branch is ready to open manually."
            exit 1
          fi
