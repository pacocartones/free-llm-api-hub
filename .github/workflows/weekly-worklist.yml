name: Weekly verification worklist

# Metadata publication only. Provider evidence review stays local and human-only.
on:
  schedule:
    - cron: '17 9 * * 1' # Monday UTC; delivery is best effort.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: weekly-worklist
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'pacocartones/free-llm-api-hub' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test worklist rendering and publication contracts
        run: node --test scripts/refresh-worklist.test.mjs scripts/staleness.test.mjs
      - name: Refresh issue 4 from checked-out main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/refresh-worklist.mjs --write
