name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      # derived-fingerprints.json lives at the repo root, outside the dirs above,
      # but a pin change means the build output shifted — redeploy and re-verify it.
      - 'derived-fingerprints.json'
  workflow_dispatch: {}

# Allow one concurrent deployment; never cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the updates page / RSS feed is complete
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build site payload (copies dataset + exports into site/)
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: Verify live deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Sitemap parity — committed must equal deployed
        run: node scripts/check-sitemap-live.mjs
        env:
          FLLM_SITE: ${{ needs.deploy.outputs.page_url }}
          FLLM_LIVE_ATTEMPTS: 6
          FLLM_LIVE_RETRY_DELAY: 10
      - name: Smoke test — every published sitemap URL answers 200
        run: node scripts/smoke-live.mjs
        env:
          FLLM_SITE: ${{ needs.deploy.outputs.page_url }}
