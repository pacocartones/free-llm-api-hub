name: Deploy site

# When it deploys depends on the repository variable REGEN_MODE (docs/regeneration-bot.md):
#   - push: the regeneration bot commits the derived files to main after a merge. A push that changes an input of
#     "Regenerate derived files" (or that the bot made) is not deployed by itself; the deploy runs when that
#     workflow finishes on main (workflow_run), so the committed sitemap the live check compares is current.
#     Other pushes (a script or style under site/, say) deploy at once, as before.
#   - anything else: every push in the paths below deploys, and workflow_run runs are skipped.
# The daily schedule and the manual "Run workflow" button deploy in every mode.
# The `gate` job decides (pagesDeploy() in scripts/lib/regenerate.mjs, tested). workflow_run is safe here: the
# upstream workflow runs on main only (push, schedule, manual) and never on pull-request code, and this workflow
# always checks out main.
on:
  workflow_run:
    workflows: ['Regenerate derived files']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      # derived-fingerprints.json lives at the repo root, outside the dirs above,
      # but a pin change means the build output shifted — redeploy and re-verify it.
      - 'derived-fingerprints.json'
      # These authored docs are rendered into /contributing/ and /methodology/.
      - 'CONTRIBUTING.md'
      - 'docs/methodology.md'
  # The star counter is read from the GitHub API at every deploy (see the refresh step below), so the site is
  # deployed once a day even when nobody pushes: the number then never ages more than a day.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {}

# Allow one concurrent deployment; never cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege: only the deploy job can write Pages or mint an OIDC token.
# The build job runs repository scripts with GITHUB_TOKEN and gets read access only.
permissions:
  contents: read

jobs:
  gate:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the push's range (before..after) must be in the clone
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: gate
        name: Mode, event and pushed paths
        env:
          REGEN_MODE: ${{ vars.REGEN_MODE }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BOT_LOGIN: ${{ vars.REGEN_APP_SLUG && format('{0}[bot]', vars.REGEN_APP_SLUG) || '' }}
          BEFORE: ${{ github.event.before }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/regenerate-guard.mjs pages-gate

  build:
    needs: gate
    if: ${{ needs.gate.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the updates page / RSS feed is complete
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Refresh the star count (the committed number stays if GitHub does not answer)
        run: node scripts/refresh-stars.mjs --keep-on-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site payload (copies dataset + exports into site/)
        run: node scripts/build.mjs
        env:
          # Google Analytics 4 behind an opt-in consent banner (scripts/lib/analytics.mjs). Empty until the owner sets the
          # repository variable GA_MEASUREMENT_ID (Settings > Secrets and variables > Actions > Variables): then no
          # analytics code is built at all.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      # IndexNow, part 1: the live sitemaps are still the previous deploy's, so the URLs this deploy adds or changes
      # are the difference (scripts/indexnow.mjs, docs/architecture.md). Best effort: the script always exits 0, and
      # a failure here only means nothing is announced.
      - name: IndexNow — list the URLs this deploy adds or changes (best effort)
        id: indexnow
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow.mjs --plan
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # The action leaves out every file or folder whose name starts with a dot unless asked; without this,
          # site/.well-known/security.txt was never published. .git and .github stay excluded either way.
          include-hidden-files: true
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    name: Verify live deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Sitemap parity — committed must equal deployed
        run: node scripts/check-sitemap-live.mjs
        env:
          FLLM_SITE: ${{ needs.deploy.outputs.page_url }}
          FLLM_LIVE_ATTEMPTS: 6
          FLLM_LIVE_RETRY_DELAY: 10
      - name: Smoke test — every published sitemap URL answers 200
        run: node scripts/smoke-live.mjs
        env:
          FLLM_SITE: ${{ needs.deploy.outputs.page_url }}
          # Edge propagation: retry only the URLs that did not answer 200, waiting 10, 20, 40, 60 s.
          FLLM_LIVE_ATTEMPTS: 5
          FLLM_LIVE_RETRY_DELAY: 10

  # IndexNow, part 2: once the deploy is verified live, announce those URLs to api.indexnow.org (Bing, Yandex and
  # the other participating engines). Never fails the deploy: the job is continue-on-error, the script always exits
  # 0 and every request has a timeout. The key is public by design (site/<key>.txt); no secret is involved.
  indexnow:
    name: IndexNow (best effort)
    needs: [build, verify-live]
    if: needs.build.outputs.indexnow_urls != '' && needs.build.outputs.indexnow_urls != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Submit the changed URLs to IndexNow
        timeout-minutes: 2
        run: node scripts/indexnow.mjs --submit
        env:
          # Passed through the environment, never interpolated into the script.
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow_urls }}
