name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Allow one concurrent deployment; never cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the updates page / RSS feed is complete
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build site payload (copies dataset + exports into site/)
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
