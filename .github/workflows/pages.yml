name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      # derived-fingerprints.json lives at the repo root, outside the dirs above,
      # but a pin change means the build output shifted — redeploy and re-verify it.
      - 'derived-fingerprints.json'
  workflow_dispatch: {}

# Allow one concurrent deployment; never cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the updates page / RSS feed is complete
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build site payload (copies dataset + exports into site/)
        run: node scripts/build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    name: Verify live deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Sitemap parity — committed must equal deployed
        run: node scripts/check-sitemap-live.mjs
        env:
          FLLM_SITE: ${{ needs.deploy.outputs.page_url }}
          FLLM_LIVE_ATTEMPTS: 6
          FLLM_LIVE_RETRY_DELAY: 10
      - name: Smoke test — every published sitemap URL answers 200
        run: node scripts/smoke-live.mjs
        env:
          FLLM_SITE: ${{ needs.deploy.outputs.page_url }}
