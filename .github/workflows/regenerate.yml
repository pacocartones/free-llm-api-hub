name: Regenerate

# The bot owns every generated artifact.
#
# This is what lets a contributor open a pull request that touches exactly one
# file. They edit `data/providers.json`; once it lands on `main`, this job
# rebuilds the README tables, the freshness badge, the CSV/YAML exports, the
# `collections/` markdown and the site payload, and commits the result.
#
# The result is delivered as a pull request (`bot/regenerate` → `main`), not a
# direct push: `main` requires the "Dataset integrity" status check, and a bot
# commit cannot report that check before the push it would trigger — a direct
# push from GITHUB_TOKEN is rejected by branch protection ("Required status
# check … is expected"). A PR runs the check normally and merges through the
# same gate as any other change. The published site does not depend on this
# commit — `pages.yml` runs its own build before every deploy.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write # gh pr create/view on bot/regenerate

concurrency:
  group: regenerate-main
  cancel-in-progress: false

jobs:
  regenerate:
    name: Rebuild generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Integrity first: never commit artifacts built from an invalid dataset.
      - name: Validate dataset before rebuilding
        run: node scripts/validate.mjs

      - name: Rebuild every generated artifact from the data
        run: node scripts/build.mjs

      - name: Open or update a regeneration pull request
        env:
          # A PAT bypasses GitHub's "Allow GitHub Actions to create and approve
          # pull requests" restriction (off by default; Settings → Actions →
          # General). Without one, GITHUB_TOKEN works only once that setting is
          # enabled; otherwise the branch is pushed and an actionable warning
          # explains what to do instead of failing cryptically.
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          if git diff --quiet; then
            echo "Generated files already in sync — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/regenerate
          git add -A
          git commit -m "chore: regenerate derived files from the dataset"
          git push --force origin bot/regenerate
          if gh pr view bot/regenerate --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Regeneration PR already open — branch updated."
          elif gh pr create --repo "$GITHUB_REPOSITORY" --base main --head bot/regenerate \
            --title "chore: regenerate derived files from the dataset" \
            --body "Regenerated by the bot after a change to \`data/**\` or \`scripts/**\` on \`main\`. The required checks run on this PR; merge when green."; then
            echo "Regeneration PR created."
          else
            echo "::warning::bot/regenerate was pushed but the PR could not be created. Enable \"Allow GitHub Actions to create and approve pull requests\" (Settings → Actions → General) or add a GH_PAT secret (repo scope); either way the branch is ready to open manually."
            exit 1
          fi
