name: Weekly model backfill

# Automated maintenance: refresh `models_free` samples from the providers'
# live public /models endpoints once a week. If the catalog changed, the
# workflow regenerates every derived artifact (build + OG + tests), commits
# the backfill on a branch and opens a PR for review — there is no direct
# push to main. If the catalog is unchanged, the run exits cleanly with no PR.
#
#   node scripts/fetch-models.mjs   # what the job runs (--write)
#
# The PR still goes through the normal Verify gate (drift-gate + tests), so a
# bot commit can never slip past the same checks as a human one.
#
# Key-gated providers (Groq, Cerebras, ...) are skipped unless the matching
# secret is configured on the repo — the script's anti-blank design.

on:
  schedule:
    # 03:00 UTC every Monday.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: build.mjs mines the updates feed from git log

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # og.mjs needs @resvg/resvg-js (devDependency). There is no lockfile,
      # so plain `npm install` would create one and dirty the tree — install
      # the dependency without saving it or writing a lockfile.
      - name: Install OG renderer (devDependency, unsaved)
        run: npm install --no-save --no-audit --no-fund --package-lock=false

      - name: Snapshot current model samples
        run: cp data/providers.json /tmp/providers-before.json

      - name: Refresh model samples from live public catalogs
        run: node scripts/fetch-models.mjs --write

      - name: Detect catalog drift
        id: drift
        run: |
          if git diff --quiet -- data/providers.json; then
            echo "No catalog drift — nothing to backfill."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate derived payloads and OG images
        if: steps.drift.outputs.changed == 'true'
        run: |
          npm run build
          npm run og

      - name: Run the full test suite
        if: steps.drift.outputs.changed == 'true'
        run: npm test

      - name: List providers whose samples changed
        if: steps.drift.outputs.changed == 'true'
        id: changed-list
        run: |
          LIST=$(node -e "
            const fs = require('fs');
            const before = JSON.parse(fs.readFileSync('/tmp/providers-before.json', 'utf8')).providers;
            const after = JSON.parse(fs.readFileSync('data/providers.json', 'utf8')).providers;
            const b = Object.fromEntries(before.map((p) => [p.slug, p]));
            const changed = after
              .filter((p) => JSON.stringify(b[p.slug].models_free) !== JSON.stringify(p.models_free))
              .map((p) => p.slug);
            console.log(changed.join(', ') || 'none');
          ")
          echo "changed_list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Create the backfill branch and commit the data + derivatives
        if: steps.drift.outputs.changed == 'true'
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automated-backfill/$(date -u +%Y-%m-%d-%H%M%S)"
          git checkout -B "$BRANCH"
          git add data/providers.json README.md data/providers.csv data/providers.yaml collections site/index.html site/sitemap.xml site/robots.txt docs/credit-programs.md CITATION.cff data/probe-report.json badge-verified.json site/badge-verified.json
          git commit -m "data: refresh models_free from live provider APIs"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # The commit above enters the updates feed (git log is a build input), so
      # updates.html/feed.xml shift and the derived-fingerprints pin goes stale
      # by design. Rebuild, then commit the refreshed pin. A pin-only commit
      # touches only the repo root — it does not re-enter the feed, so the tree
      # stabilizes after this one step (see docs/architecture.md).
      - name: Absorb the feed churn and pin the new payload
        if: steps.drift.outputs.changed == 'true'
        run: |
          npm run build
          git add derived-fingerprints.json
          git commit -m "chore: refresh derived-fingerprints pin" || true

      - name: Verify the drift gate passes before pushing
        if: steps.drift.outputs.changed == 'true'
        run: npm run check

      - name: Push the branch
        if: steps.drift.outputs.changed == 'true'
        run: |
          git push -u origin "${{ steps.branch.outputs.branch }}" --force-with-lease

      - name: Open the backfill PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Automated weekly backfill — \`node scripts/fetch-models.mjs --write\` refreshed \`models_free\` from the providers' live public /models endpoints, then regenerated every derived artifact (\`npm run build\` + \`npm run og\`) and passed \`npm test\` + \`npm run check\` locally in the workflow.

          **Providers with changed samples:** ${{ steps.changed-list.outputs.changed_list }}

          Review the diff in \`data/providers.json\` (samples only — no fields other than \`models_free\` are touched). Key-gated providers are skipped unless their secret is configured, so a provider with no listed change means its catalog did not move or its key is not set.

          Generated by the [weekly model backfill workflow](.github/workflows/backfill.yml)."
          gh pr create --base main --head "${{ steps.branch.outputs.branch }}" \
            --title "data: weekly model backfill — refresh samples from live provider APIs" \
            --body "$BODY"
