name: MCP package CI

# Runs the tests of packages/mcp on every pull request and push that touches it.
on:
  pull_request:
    paths: ['packages/mcp/**', '.github/workflows/mcp-ci.yml', '.github/workflows/release-mcp.yml', 'scripts/check-mcp-release.sh', 'scripts/release-mcp.test.mjs']
  push:
    branches: [main]
    paths: ['packages/mcp/**', '.github/workflows/mcp-ci.yml', '.github/workflows/release-mcp.yml', 'scripts/check-mcp-release.sh', 'scripts/release-mcp.test.mjs']

permissions:
  contents: read

jobs:
  test:
    name: mcp tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Offline release decisions
        run: node --test ../../scripts/release-mcp.test.mjs
      - name: server.json against the registry schema
        run: npm run validate:server-json
      - name: What would be published
        run: npm pack --dry-run
