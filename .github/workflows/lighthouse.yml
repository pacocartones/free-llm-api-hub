name: Lighthouse

# Accessibility, SEO and performance budget for the built site.
#
# Serves site/ itself on a free local port and measures what it serves with
# Lighthouse, on twenty-four pages: the home, /best/, /coverage/, /quality/, /free-gpu/, /coding-tools/,
# /compare/, /find/, /data-policy/, /guides-and-collections/, /not-free/, /embed/ and one provider page, plus
# /collections/no-credit-card.html, /collections/openai-compatible.html,
# /guides/free-llm-api-no-signup.html, /guides/free-embeddings-apis.html,
# /guides/free-ocr-document-ai-apis.html, /guides/free-speech-to-text-apis.html
# and /guides/free-image-generation-apis.html, the model-family page /free-api/qwen/,
# plus one model page under /models/ (the indexable one listed by the most providers), and the first page
# under /limits/ and under /alternatives/. The thresholds are in
# scripts/lib/lighthouse-gate.mjs: accessibility at least 0.95 with no new or
# unscored accessibility audit, SEO exactly 1, performance at least 0.80. Every run
# also checks each page's font budget (FONT_BUDGET_BYTES in scripts/lib/assets.mjs:
# 90 KB for the Roboto Flex and DM Mono files a page declares).
#
# The work is split by how stable each category is on a shared runner:
#   - Pull requests: accessibility and SEO, one run per page, three pages at a
#     time. Both are deterministic, so one run is the same verdict as three,
#     and pages measured side by side get the same verdict as one at a time.
#     The job keeps the name of the required check.
#   - Push to main, nightly and manual runs: performance, median of three runs
#     per page (one run moves too much: 0.78 and 0.91 on the same commit). Every
#     failure on main refreshes the one open issue body with the latest UTC time,
#     commit, run URL, and failing pages and scores. A comment is added only when
#     the failing pages or scores differ from the previous failure; an identical
#     repeated failure adds no comment. The first later clean run replaces the
#     body with the recovery result and closes the issue. A failure after closure
#     opens a new issue labelled `bug` and `area:site`.
#     Pushes by the regeneration bot (free-llm-api-hub-regen[bot]) are skipped.
#
# A change that cannot reach the built site (docs other than the methodology, workflows other than this one, root
# Markdown other than README and CONTRIBUTING, the MCP package, the scripts/*.test.mjs test files) is not measured: scripts/lighthouse-scope.mjs decides
# at the start of each measuring job and the rest of the job is skipped. The job itself still runs, so the required
# check reports success on such a pull request (a workflow-level `paths:` filter would leave it pending forever). The
# nightly and manual runs always measure.
#
# No secret is used. The measuring jobs can only read the repository; only the
# report job, which checks nothing out and runs on main only, can write issues.
#
# Lighthouse is installed from tools/lighthouse (its own package.json and
# lockfile), so the dataset pipeline in the root package.json stays light.
on:
  # No `paths:` filter, for the same reason as verify.yml: a check that is
  # filtered out never reports.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *' # nightly, UTC; delivery is best effort.
  workflow_dispatch: {}

# A newer push to the same pull request supersedes the older run; pushes to main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lighthouse:
    # Required check on main: keep this name, even though performance now runs in the job below.
    name: Lighthouse accessibility and performance
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      # The scope script uses only Node built-ins, so it runs on the runner's preinstalled Node, before setup-node:
      # a skipped run then sets up nothing (and setup-node's cache step never tries to save a cache that was never
      # filled, which fails the job). HEAD is the pull request's merge commit; its first parent is the base branch.
      - id: scope
        name: Does this change reach the built site?
        env:
          EVENT: ${{ github.event_name }}
        run: BASE="$(git rev-parse HEAD^1)" node scripts/lighthouse-scope.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/lighthouse/package-lock.json

      # /best/ and the provider pages are generated into site/ and are not
      # committed, so the site has to be built before it can be served.
      - name: Build the site
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: node scripts/build.mjs

      - name: Install Lighthouse (locked, no lifecycle scripts)
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: tools/lighthouse
        run: npm ci --ignore-scripts

      - name: Measure the twenty-four pages (accessibility and SEO, one run each, three at a time)
        if: ${{ steps.scope.outputs.run == 'true' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/lighthouse-gate.mjs --mode=accessibility-seo

  performance:
    name: Lighthouse performance (median of 3)
    # Not on the regeneration bot's pushes (docs/regeneration-bot.md): they only rewrite derived files right after
    # a merge that was measured already, and the nightly run measures the result.
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.actor == 'free-llm-api-hub-regen[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failures: ${{ steps.measure.outputs.failures }}
      measured: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      # As above. A push compares the commit it replaced with the pushed one; the nightly and manual runs always measure.
      - id: scope
        name: Does this change reach the built site?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
        run: node scripts/lighthouse-scope.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/lighthouse/package-lock.json
      - name: Build the site
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: node scripts/build.mjs
      - name: Install Lighthouse (locked, no lifecycle scripts)
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: tools/lighthouse
        run: npm ci --ignore-scripts
      - name: Measure the twenty-four pages (performance, median of three runs)
        if: ${{ steps.scope.outputs.run == 'true' }}
        id: measure
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/lighthouse-gate.mjs --mode=performance

  report:
    name: Report performance on main
    needs: performance
    # Main only (push, nightly or a manual run on main), and only when the measurement finished either way. A push
    # the scope step did not measure says nothing about performance, so it neither opens nor closes the issue. A job
    # that failed before the scope step still reports its failure.
    if: ${{ always() && github.repository == 'pacocartones/free-llm-api-hub' && github.ref == 'refs/heads/main' && (needs.performance.result == 'success' || needs.performance.result == 'failure') && (needs.performance.outputs.measured == 'true' || needs.performance.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the performance issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.performance.result }}
          FAILURES: ${{ needs.performance.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          title='Lighthouse performance below budget'
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body=$(mktemp)

          if [ "$RESULT" = failure ]; then
            if [ -n "$FAILURES" ]; then
              report=$(printf '%s\n' "$FAILURES" | sed 's/```/` ` `/g' | sort -u)
            else
              report='No budget failure was recorded: the job stopped before measuring (for example, during build or install).'
            fi
            signature=$(printf '%s\n' "$report" | sha256sum | cut -d' ' -f1)
            timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            {
              echo 'Latest result: FAILURE'
              echo
              echo "UTC: $timestamp"
              printf 'Commit: `%s`\n' "$COMMIT"
              echo "Run: $RUN_URL"
              echo
              echo '### Failing pages and scores'
              echo
              echo '```text'
              printf '%s\n' "$report"
              echo '```'
              echo
              echo "<!-- lighthouse-failure-signature: $signature -->"
            } > "$body"

            if [ -n "$number" ]; then
              previous_signature=$(gh issue view "$number" --json body --jq '.body' |
                sed -n 's/.*<!-- lighthouse-failure-signature: \([0-9a-f]*\) -->.*/\1/p' | head -n 1)
              # Always refresh commit, run URL, UTC time and the current failure details.
              gh issue edit "$number" --body-file "$body"
              # Keep the issue timeline quiet unless the failure set or a score actually changed.
              if [ -n "$previous_signature" ] && [ "$signature" != "$previous_signature" ]; then
                gh issue comment "$number" --body-file "$body"
              fi
            else
              # A closed issue is not reused: this creates the next failure episode.
              gh issue create --title "$title" --label bug --label area:site --body-file "$body"
            fi
          elif [ -n "$number" ]; then
            timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            {
              echo 'Latest result: CLEAN — performance is back within budget.'
              echo
              echo "UTC: $timestamp"
              printf 'Commit: `%s`\n' "$COMMIT"
              echo "Run: $RUN_URL"
              echo
              echo 'This is the first clean run after the reported performance failure; the issue is now closed.'
            } > "$body"
            gh issue edit "$number" --body-file "$body"
            gh issue close "$number" --reason completed
          fi