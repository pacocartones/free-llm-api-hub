name: Lighthouse

# Accessibility and performance budget for the built site.
#
# Serves site/ itself on a free local port and measures what it serves with
# Lighthouse, on four pages: the home, /best/, /coverage/ and one provider page.
# The job fails when a page falls below the thresholds in
# scripts/lib/lighthouse-gate.mjs. Nothing is published, no secret is used, and
# the token can only read the repository.
#
# Lighthouse is installed from tools/lighthouse (its own package.json and
# lockfile), so the dataset pipeline in the root package.json stays light.
on:
  # No `paths:` filter, for the same reason as verify.yml: a check that is
  # filtered out never reports.
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse accessibility and performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # /best/ and the provider pages are generated into site/ and are not
      # committed, so the site has to be built before it can be served.
      - name: Build the site
        run: node scripts/build.mjs

      - name: Install Lighthouse (locked, no lifecycle scripts)
        working-directory: tools/lighthouse
        run: npm ci --ignore-scripts

      - name: Measure the four pages
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/lighthouse-gate.mjs
