name: Weekly maintenance

# The routine upkeep ritual. Runs Mondays 08:00 UTC — ~10:00 Europe/Madrid in summer
# (CEST), ~09:00 in winter (CET), since GitHub cron does not observe DST.
# Backbone is automated here; the human steps live in docs/update-playbook.md.
#
# Delivery: any drift (freshness badge, free model samples) is delivered as a pull
# request (bot/maintenance → main), never a direct push. main requires the
# "Dataset integrity" status check, and a direct push with [skip ci] cannot report
# it — the weekly runs failed with GH006 ("Required status check is expected") until
# this was fixed on 2026-08-11. Same trust model as regenerate.yml.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write # gh pr create/view on bot/maintenance

concurrency:
  group: maintenance-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Integrity first: never commit artifacts built from an invalid dataset.
      - name: Validate dataset before building
        run: node scripts/validate.mjs

      # 1. Re-check every source link; open/update a tracking issue on breakage.
      - name: Check source links
        id: links
        run: |
          set -e
          node -e "const d=require('./data/providers.json');for(const p of d.providers){if(p.docs_url)console.log(p.docs_url)}" | sort -u > /tmp/urls.txt
          : > /tmp/failed.txt
          while IFS= read -r url; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 \
              -A "Mozilla/5.0 (compatible; free-llm-api-hub-linkcheck/2.0)" "$url" || echo "000")
            case "$code" in
              401|403|405|429) : ;;                                   # alive but bot-blocked
              000|4*|5*) echo "- $url (HTTP $code)" >> /tmp/failed.txt ;;
              *) : ;;
            esac
          done < /tmp/urls.txt
          if [ -s /tmp/failed.txt ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Report broken links
        if: steps.links.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "These source links returned an error during the weekly check on $(date -u +%Y-%m-%d):"; echo
            cat /tmp/failed.txt; echo
            echo "Re-verify the affected entry, update its \`last_verified\` (or set \`verified: false\`), and fix the link."
          } > /tmp/links.txt
          existing=$(gh issue list --search "Broken source link in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body-file /tmp/links.txt;
          else gh issue create --title "🔗 Broken source link report" --body-file /tmp/links.txt --label maintenance; fi

      # 2. Recompute the freshness badge from the data (full build; the diff is
      #    committed on the maintenance branch below, not pushed to main).
      - name: Refresh badge
        run: node scripts/build.mjs

      # 2b. Refresh `models_free` samples from providers' own /models endpoints.
      #     Public endpoints need no key; the key-gated ones refresh only if the
      #     matching secret is set. Failures leave the field untouched (never blanked).
      - name: Refresh free model samples
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
        run: |
          node scripts/fetch-models.mjs --write
          node scripts/build.mjs

      # 3. Publish the re-verification worklist as a single, self-updating issue.
      - name: Build re-verification worklist
        run: node scripts/staleness.mjs > /tmp/stale.md
      - name: Open or update the weekly worklist issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="🕝 Weekly re-verification worklist"
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/stale.md
            gh issue comment "$existing" --body "Refreshed on $(date -u +%Y-%m-%d). See the updated checklist above."
          else
            gh issue create --title "$title" --body-file /tmp/stale.md --label maintenance
          fi

      # 4. Deliver any drift as a pull request (bot/maintenance → main).
      - name: Open or update a maintenance pull request
        env:
          # A PAT bypasses GitHub's "Allow GitHub Actions to create and approve
          # pull requests" restriction (off by default; Settings → Actions →
          # General). Without one, GITHUB_TOKEN works only once that setting is
          # enabled; otherwise the branch is pushed and an actionable warning
          # explains what to do instead of failing cryptically.
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          if git diff --quiet; then
            echo "No maintenance drift — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/maintenance
          git add -A
          git commit -m "chore: weekly maintenance — refresh freshness badge and model samples"
          git push --force origin bot/maintenance
          # gh pr view does not filter by state: a previously merged bot/maintenance
          # PR would make it look "already open". Ask for the state explicitly and
          # only treat an OPEN PR as the branch's existing PR.
          if gh pr view bot/maintenance --repo "$GITHUB_REPOSITORY" --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            echo "Maintenance PR already open — branch updated."
          elif gh pr create --repo "$GITHUB_REPOSITORY" --base main --head bot/maintenance \
            --title "chore: weekly maintenance — refresh freshness badge and model samples" \
            --body "Weekly maintenance run (freshness badge + free model samples from provider APIs). The required checks run on this PR; merge when green."; then
            echo "Maintenance PR created."
          else
            echo "::warning::bot/maintenance was pushed but the PR could not be created. Enable \"Allow GitHub Actions to create and approve pull requests\" (Settings → Actions → General) or add a GH_PAT secret (repo scope); either way the branch is ready to open manually."
            exit 1
          fi
