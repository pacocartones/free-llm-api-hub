name: Tag release

# Creates the annotated tag `vX.Y.Z` when the dataset version in
# data/providers.json advances. Idempotent: if the tag already exists the job
# is a no-op, so running on every data change is harmless.
#
# Why a workflow and not a hand-run `git tag`? The tag kept lagging behind
# main (v2.9.0 shipped, then more re-verification landed untagged) because a
# human has to remember to run it. Pinning a snapshot for programmatic
# consumers (README "pin a snapshot") is only safe if the tag tracks the
# dataset version it describes.
on:
  push:
    branches: [main]
    paths:
      - 'data/providers.json'
  # Intentionally no workflow_dispatch: a manual run can select an unreviewed
  # ref, while this workflow can publish official tags with contents:write.

# No permissions at workflow level; the one job below asks for what it needs.
permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read dataset version
        id: version
        run: echo "value=$(node -p "require('./data/providers.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        env:
          DATASET_VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${DATASET_VERSION}"
          git check-ref-format "refs/tags/$V"
          if git ls-remote --tags origin "$V" | grep -q "refs/tags/$V"; then
            echo "tag $V already exists — nothing to do"
            exit 0
          fi
          # An annotated tag needs a tagger identity; the runner has none.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "Dataset $V"
          # Supply authentication only to this push; never store it in Git config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/$V"
          echo "created and pushed tag $V"
