name: Tag release

# Creates the annotated tag `vX.Y.Z` when the dataset version in
# data/providers.json advances. Idempotent: if the tag already exists the job
# is accepted only if annotated at this event commit on main; mismatches fail.
#
# Why a workflow and not a hand-run `git tag`? The tag kept lagging behind
# main (v2.9.0 shipped, then more re-verification landed untagged) because a
# human has to remember to run it. Pinning a snapshot for programmatic
# consumers (README "pin a snapshot") is only safe if the tag tracks the
# dataset version it describes.
on:
  push:
    branches: [main]
    paths:
      - 'data/providers.json'
  # Intentionally no workflow_dispatch: a manual run can select an unreviewed
  # ref, while this workflow can publish official tags with contents:write.

# No permissions at workflow level; the one job below asks for what it needs.
permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read dataset version
        id: version
        run: echo "value=$(node -p "require('./data/providers.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify or create the dataset tag
        env:
          DATASET_VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/tag-release.sh
