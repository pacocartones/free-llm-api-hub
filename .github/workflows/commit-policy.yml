name: Commit policy

# New commits of a pull request only (base..head), never the history before.
# Fails on maintainer-identity commits with an AI attribution trailer or footer,
# or without a verified name/email pair for Paco or Leon. Other identities are not checked.
# Also fails when a pull request opened by the maintainer account has an AI footer in its description.
on:
  pull_request:
    # edited: a changed description is checked again.
    types: [opened, edited, synchronize, reopened]

# A newer push to the same pull request supersedes the older run; pushes to main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commits:
    name: commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only to strip an AI footer from a maintainer pull request's own description (step below).
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The policy script is read from the base commit, not from the pull request:
      # a pull request must not be able to edit the required check that judges it.
      # A change to the script itself takes effect once it is merged.
      - name: Check the commits of this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:scripts/check-commit-policy.sh" > "$RUNNER_TEMP/check-commit-policy.sh"
          bash "$RUNNER_TEMP/check-commit-policy.sh" "$BASE_SHA" "$HEAD_SHA"
      - name: Check the description of a maintainer pull request
        if: github.event.pull_request.user.login == 'pacocartones'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # The description is read from the API, not from the event, so a re-run sees later edits.
        # An AI footer (Generated with Claude Code, or a Claude co-author line) is removed here and
        # the check passes; it only fails if the footer could not be removed.
        run: |
          pattern='generated (by|with) \[?claude code|co-authored-by:[[:space:]]*claude'
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          if grep -Eiq "$pattern" "$RUNNER_TEMP/body.md"; then
            perl -0777 -pe 's/^[ \t]*[_*]*[ \t]*(?:\xF0\x9F\xA4\x96[ \t]*)?Generated (?:by|with) \[?Claude Code\]?(?:\([^)]*\))?[_*]*[ \t]*\.?[ \t]*$//gmi; s/^[ \t]*Co-Authored-By:[ \t]*Claude[^\n]*$//gmi; s/\n{3,}/\n\n/g; s/\s+\z/\n/' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/clean.md"
            if grep -Eiq "$pattern" "$RUNNER_TEMP/clean.md"; then
              echo "::error::Remove the AI footer (Generated with Claude Code, or a Claude co-author line) from the pull request description."
              exit 1
            fi
            gh api -X PATCH "repos/$REPO/pulls/$PR" -F "body=@$RUNNER_TEMP/clean.md" > /dev/null
            echo "::notice::Removed an AI footer from the pull request description."
          fi
