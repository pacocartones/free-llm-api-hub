name: Commit policy

# New commits of a pull request only (base..head), never the history before.
# Fails on maintainer-identity commits with an AI attribution trailer or footer,
# or without a verified name/email pair for Paco or Leon. Other identities are not checked.
on:
  pull_request:

# A newer push to the same pull request supersedes the older run; pushes to main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commits:
    name: commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The policy script is read from the base commit, not from the pull request:
      # a pull request must not be able to edit the required check that judges it.
      # A change to the script itself takes effect once it is merged.
      - name: Check the commits of this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:scripts/check-commit-policy.sh" > "$RUNNER_TEMP/check-commit-policy.sh"
          bash "$RUNNER_TEMP/check-commit-policy.sh" "$BASE_SHA" "$HEAD_SHA"
