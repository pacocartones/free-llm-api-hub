name: Verify

# Fast integrity gate on every change.
#
# What blocks: the dataset must satisfy the integrity rules, and internal doc
# links must resolve. What does not block: the generated artifacts. Contributors
# edit `data/providers.json` and nothing else — `regenerate.yml` rebuilds README
# tables, exports, collections and the site payload on `main` and commits them.
# The drift report below is informational so a one-line data fix stays a
# one-line pull request.
#
# Scheduled upkeep (source-link re-check, badge refresh, re-verification
# worklist) lives in maintenance.yml.
on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'README.md'
      - 'collections/**'
      - '.github/workflows/verify.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Dataset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate dataset against integrity rules
        run: node scripts/validate.mjs

      - name: Check internal documentation links
        run: node scripts/check-links.mjs

      # Informational only. A mismatch here is expected on a data-only pull
      # request and is resolved by the bot after merge.
      - name: Report generated-file drift
        run: |
          node scripts/build.mjs
          targets="README.md data/providers.csv data/providers.yaml collections site/index.html docs/credit-programs.md"
          if git diff --quiet -- $targets; then
            echo "Generated files are already in sync with the data."
            echo "Generated files are in sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Generated files will be rebuilt automatically after merge. No action needed."
            {
              echo "### Generated files will be rebuilt after merge"
              echo ""
              echo "You do not need to run \`npm run build\` or commit anything else."
              echo ""
              echo '```'
              git --no-pager diff --stat -- $targets
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
