name: Verify

# Fast integrity gate on every change.
#
# What blocks: the dataset must satisfy the integrity rules, and internal doc
# links must resolve. What does not block: the generated artifacts. Contributors
# edit `data/providers.json` and nothing else — `regenerate.yml` rebuilds README
# tables, exports, collections and the site payload on `main` and commits them.
# The drift report below is informational so a one-line data fix stays a
# one-line pull request.
#
# Scheduled upkeep (source-link re-check, badge refresh, re-verification
# worklist) lives in maintenance.yml.
on:
  # No `paths:` filter on pull_request, deliberately. This job is the repository's
  # required status check, and a required check that is filtered out never reports
  # — so a pull request touching anything outside the filter (a workflow, a doc,
  # an issue template) is blocked forever with no way for its author to unblock it.
  # A maintainer does not notice, because admin bypass is one click away; an
  # outside contributor just sees "Required statuses must pass" and gives up.
  # The job is short. Running it on every pull request is much cheaper than that.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Dataset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate dataset against integrity rules
        run: node scripts/validate.mjs

      - name: Check internal documentation links
        run: node scripts/check-links.mjs

      # A provider added without running `npm run og` ships a provider page
      # whose og:image tag silently 404s — and a provider whose status, category
      # or flags changed without regenerating ships a stale image. Both fail
      # here, after the data is validated but before the test suite, with the
      # exact file(s) and the fix command. Existence + data-fingerprint check.
      - name: Check OG images are committed and match the dataset
        run: node scripts/check-og.mjs

      # The git-mined per-provider history is cheap to validate directly: two
      # git processes, no build. A miner regression (broken cat-file parse,
      # empty log) is caught here in seconds instead of after the full build
      # in the test suite below. Same invariants as build.test.mjs.
      - name: Check git-mined history integrity
        run: node scripts/check-history.mjs

      # The explorer XSS regression suite (js/xss-through-dom) ships in
      # explorer.test.mjs and must gate pull requests exactly like npm test does
      # locally — a reintroduction of data interpolated into innerHTML would
      # otherwise only be caught by the weekly CodeQL scan.
      - name: Run the pipeline test suite
        run: node --test scripts/build.test.mjs scripts/explorer.test.mjs

      # Informational only. A mismatch here is expected on a data-only pull
      # request and is resolved by the bot after merge.
      # Keep this list in sync with the `check` script in package.json.
      - name: Report generated-file drift
        run: |
          node scripts/build.mjs
          targets="README.md data/providers.csv data/providers.yaml collections site/index.html docs/credit-programs.md badge-freshness.json CITATION.cff data/probe-report.json"
          if git diff --quiet -- $targets; then
            echo "Generated files are already in sync with the data."
            echo "Generated files are in sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Generated files will be rebuilt automatically after merge. No action needed."
            {
              echo "### Generated files will be rebuilt after merge"
              echo ""
              echo "You do not need to run \`npm run build\` or commit anything else."
              echo ""
              echo '```'
              git --no-pager diff --stat -- $targets
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
