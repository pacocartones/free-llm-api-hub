name: Verify

# Fast integrity gate on every change.
#
# What blocks: the dataset must satisfy the integrity rules, internal doc links
# must resolve, and the generated artifacts must be in sync with the data. The
# author regenerates them locally (`npm run build`, `npm run og`) and commits
# them in the same PR. There is no regeneration bot for changes you author —
# the author regenerates locally. There is no scheduled workflow at all:
# re-verification, badge, probe and the `models_free` backfill all stay local
# and on-demand, see docs/update-playbook.md.
on:
  # No `paths:` filter on pull_request, deliberately. This job is the repository's
  # required status check, and a required check that is filtered out never reports
  # — so a pull request touching anything outside the filter (a workflow, a doc,
  # an issue template) is blocked forever with no way for its author to unblock it.
  # A maintainer does not notice, because admin bypass is one click away; an
  # outside contributor just sees "Required statuses must pass" and gives up.
  # The job is short. Running it on every pull request is much cheaper than that.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Dataset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # JSON Schema validation uses locked development dependencies. Disable
      # lifecycle scripts so CI only installs the declared tooling.
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Validate dataset against integrity rules
        run: node scripts/validate.mjs

      - name: Check internal documentation links
        run: node scripts/check-links.mjs

      # A provider added without running `npm run og` ships a provider page
      # whose og:image tag silently 404s — and a provider whose status, category
      # or flags changed without regenerating ships a stale image. Both fail
      # here, after the data is validated but before the test suite, with the
      # exact file(s) and the fix command. Existence + data-fingerprint check.
      - name: Check OG images are committed and match the dataset
        run: node scripts/check-og.mjs

      # The git-mined per-provider history is cheap to validate directly: two
      # git processes, no build. A miner regression (broken cat-file parse,
      # empty log) is caught here in seconds instead of after the full build
      # in the test suite below. Same invariants as build.test.mjs.
      - name: Check git-mined history integrity
        run: node scripts/check-history.mjs

      # Editorial ranking must only feature verified providers. Same invariants
      # as scripts/lib/best.mjs (and the best.test.mjs suite): a renamed slug or
      # an unverified pick fails here in milliseconds, before the full suite.
      - name: Check editorial ranking integrity
        run: node scripts/check-best.mjs

      # The explorer XSS regression suite (js/xss-through-dom) ships in
      # explorer.test.mjs and must gate pull requests exactly like npm test does
      # locally — a reintroduction of data interpolated into innerHTML would
      # otherwise only be caught by the weekly CodeQL scan.
      - name: Run the pipeline test suite
        run: node --test scripts/build.test.mjs scripts/explorer.test.mjs scripts/best.test.mjs

      # The PR must ship its own regenerated files — there is no regeneration
      # bot anymore, so an out-of-sync main would otherwise stay broken.
      # badge-freshness.json is the one deliberate exception: it is
      # date-relative (the oldest age in days moves daily) and is refreshed on
      # every data/build pass, so it is excluded from the diff below.
      # Keep this list in sync with the `check` script in package.json.
      - name: Generated files must be in sync with the data
        run: |
          node scripts/build.mjs
          targets="README.md collections site/index.html site/sitemap.xml site/robots.txt docs/credit-programs.md CITATION.cff data/probe-report.json badge-verified.json site/badge-verified.json derived-fingerprints.json"
          if git diff --quiet -- $targets; then
            echo "Generated files are in sync with the data."
            echo "Generated files are in sync." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Regenerate the derived files and commit them in this PR"
              echo ""
              echo "Run \`npm run build\` (and \`npm run og\` if the OG check flagged"
              echo "drift), commit the regenerated files together with the data"
              echo "change, then push again."
              echo ""
              echo '```'
              git --no-pager diff --stat -- $targets
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
