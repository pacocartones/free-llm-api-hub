name: Verify

# Fast integrity gate on every change.
#
# What blocks: the dataset must satisfy the integrity rules, internal doc links
# must resolve, and the derived files must agree with the data. How strictly
# depends on the repository variable REGEN_MODE (docs/regeneration-bot.md):
#   - push: the regeneration bot (regenerate.yml) commits the derived files to
#     main after the merge, so a data PR does not regenerate them. The checks
#     run on a freshly regenerated tree, and only derived files the PR edits by
#     hand (and that the build would not write), a release PR that is not fully
#     regenerated, or drift outside the bot's allowlist block.
#   - anything else (shadow, off, unset): the author regenerates locally
#     (`npm run build`, `npm run og`) and commits the result in the same PR;
#     any drift blocks, as before the bot existed.
# The required check names (Dataset integrity, Windows tests) are the same in
# every mode. The weekly-worklist workflow publishes issue
# metadata only; provider re-verification, badge regeneration, probe and the
# `models_free` backfill stay local and on-demand, see docs/update-playbook.md.
on:
  # No `paths:` filter on pull_request, deliberately. This job is the repository's
  # required status check, and a required check that is filtered out never reports
  # — so a pull request touching anything outside the filter (a workflow, a doc,
  # an issue template) is blocked forever with no way for its author to unblock it.
  # A maintainer does not notice, because admin bypass is one click away; an
  # outside contributor just sees "Required statuses must pass" and gives up.
  # The job is short. Running it on every pull request is much cheaper than that.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch: {}

# A newer push to the same pull request supersedes the older run; pushes to main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Dataset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: build.mjs mines per-provider history from git log
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # JSON Schema validation uses locked development dependencies. Disable
      # lifecycle scripts so CI only installs the declared tooling.
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      # One parser for REGEN_MODE (scripts/lib/regenerate.mjs): only `push` relaxes the drift gate below.
      - id: regen
        name: Regeneration mode
        env:
          REGEN_MODE: ${{ vars.REGEN_MODE }}
        run: node scripts/regenerate-guard.mjs mode

      - name: Validate dataset against integrity rules
        run: node scripts/validate.mjs

      # In push mode the PR does not ship its derived files, so every check below
      # must see what main will hold once the bot has run: regenerate first. The
      # drift gate at the end compares against the PR's own commit, not this tree.
      - name: Regenerate the derived files first (REGEN_MODE=push)
        if: ${{ steps.regen.outputs.mode == 'push' }}
        run: |
          node scripts/build.mjs
          node scripts/check-og.mjs || node scripts/og.mjs

      # `generated` is the release date: it moves only together with `version`
      # (npm run release:prepare). A data pull request that bumps it would put
      # the same line in conflict with every other open data pull request.
      # HEAD^1 is the base branch in the pull request's merge commit, and the
      # previous main on a push (fetch-depth: 0 above).
      - name: Release stamp moves only with the version
        run: node scripts/check-release-stamp.mjs

      - name: Check internal documentation links
        run: node scripts/check-links.mjs

      # A provider added without running `npm run og` ships a provider page
      # whose og:image tag silently 404s — and a provider whose status, category
      # or flags changed without regenerating ships a stale image. Both fail
      # here, after the data is validated but before the test suite, with the
      # exact file(s) and the fix command. Existence + data-fingerprint check.
      - name: Check OG images are committed and match the dataset
        run: node scripts/check-og.mjs

      # The git-mined per-provider history is cheap to validate directly: two
      # git processes, no build. A miner regression (broken cat-file parse,
      # empty log) is caught here in seconds instead of after the full build
      # in the test suite below. Same invariants as build.test.mjs.
      - name: Check git-mined history integrity
        run: node scripts/check-history.mjs

      # Editorial ranking must only feature verified providers. Same invariants
      # as scripts/lib/best.mjs (and the best.test.mjs suite): a renamed slug or
      # an unverified pick fails here in milliseconds, before the full suite.
      - name: Check editorial ranking integrity
        run: node scripts/check-best.mjs

      # The explorer XSS regression suite (js/xss-through-dom) ships in
      # explorer.test.mjs and must gate pull requests exactly like npm test does
      # locally. These runtime checks complement CodeQL static analysis on
      # pull requests and the weekly main scan.
      - name: Run the pipeline test suite
        run: node scripts/run-tests.mjs

      # Outside push mode the PR must ship its own regenerated files: the
      # regeneration bot does not commit to main, so an out-of-sync main would
      # otherwise stay broken.
      # The freshness badge is date-relative (the oldest age in days moves
      # daily), so it is not committed at all: the build writes
      # site/badge-freshness.json and every deploy publishes it.
      # The list of files is derived from git (scripts/generated-targets.mjs); the `check` script in package.json uses the same.
      - name: Generated files must be in sync with the data
        if: ${{ steps.regen.outputs.mode != 'push' }}
        run: |
          node scripts/build.mjs
          # The list comes from git (scripts/generated-targets.mjs): every committed page under site/ that the
          # build writes, so a new page is covered the day it is committed. A page the build writes that was never
          # `git add`ed is reported too: the deploy would publish it, and no pull request would show it.
          targets="$(node scripts/generated-targets.mjs)"
          untracked="$(node scripts/generated-targets.mjs --untracked)"
          if git diff --quiet -- $targets && [ -z "$untracked" ]; then
            echo "Generated files are in sync with the data."
            echo "Generated files are in sync." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Regenerate the derived files and commit them in this PR"
              echo ""
              echo "Run \`npm run build\` (and \`npm run og\` if the OG check flagged"
              echo "drift), commit the regenerated files together with the data"
              echo "change, then push again."
              echo ""
              echo '```'
              git --no-pager diff --stat -- $targets
              if [ -n "$untracked" ]; then
                echo "Written by the build and not committed:"
                echo "$untracked" | tr ' ' '\n'
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Push mode: stale derived files this PR did not touch pass (the bot
      # regenerates them after the merge). Still blocking: derived files the PR
      # edits that do not match the build (the bot would silently overwrite
      # them), a release PR that is not fully regenerated (tag-release.yml tags
      # its merge), and drift outside the bot's allowlist. HEAD^1 is the base
      # branch in the PR's merge commit and the previous main on a push. The
      # decision is driftGate() in scripts/lib/regenerate.mjs, tested.
      - name: Derived files must not be hand-edited, and a release ships them regenerated (REGEN_MODE=push)
        if: ${{ steps.regen.outputs.mode == 'push' }}
        env:
          REGEN_MODE: ${{ steps.regen.outputs.mode }}
        run: |
          node scripts/build.mjs
          BASE="$(git rev-parse HEAD^1)" node scripts/regenerate-guard.mjs drift-gate

  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    steps:
      # Set up git as a contributor's Windows machine often is: CRLF conversion on, and every commit and tag signed by
      # a program that fails (a key behind a passphrase, or no gpg). The checkout must still be LF (.gitattributes) and
      # the suite must not depend on the signing config.
      - name: Configure git like a contributor machine
        run: |
          git config --global core.autocrlf true
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global gpg.format openpgp
          git config --global gpg.program false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tests mine per-provider history from git log
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - id: regen
        name: Regeneration mode
        env:
          REGEN_MODE: ${{ vars.REGEN_MODE }}
        run: node scripts/regenerate-guard.mjs mode

      # As in Dataset integrity: in push mode the suite runs on the tree main will hold after the bot's run.
      - name: Regenerate the derived files first (REGEN_MODE=push)
        if: ${{ steps.regen.outputs.mode == 'push' }}
        run: node scripts/build.mjs

      # The runner may create symlinks; a contributor without Developer Mode may not (#783). The preload refuses them
      # as Windows does there, junctions still work. A file URL, so the test processes in other folders find it too.
      - name: Run the full test suite without symlink privileges
        shell: pwsh
        run: |
          $preload = ([System.Uri](Join-Path $PWD 'scripts/lib/deny-symlinks.mjs')).AbsoluteUri
          $env:NODE_OPTIONS = "--import=$preload"
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # A push to main is checked again after the merge (two pull requests that pass
  # alone can fail together, e.g. a duplicate slug). A failure there used to be
  # visible only on the commit's status; this job turns it into one open issue,
  # comments on it while main stays broken, and closes it on the next clean run.
  # It checks nothing out and runs no repository code; its token can only write
  # issues. Pull requests never reach it.
  report:
    name: Report Verify on main
    needs: [validate, windows-tests]
    if: ${{ always() && github.repository == 'pacocartones/free-llm-api-hub' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the Verify issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          LINUX: ${{ needs.validate.result }}
          WINDOWS: ${{ needs.windows-tests.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          title='Verify failed on main'
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body=$(mktemp)
          if [ "$FAILED" = true ]; then
            {
              echo "Verify failed on \`$COMMIT\` after it reached main."
              echo
              echo "- Dataset integrity (Linux): $LINUX"
              echo "- Windows tests: $WINDOWS"
              echo
              echo "Open the run, read the failed step, and fix main in a pull request. Run: $RUN_URL"
            } > "$body"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              gh issue create --title "$title" --label chore --body-file "$body"
            fi
          elif [ -n "$number" ]; then
            printf 'Verify passes again on `%s`.\n\nRun: %s\n' "$COMMIT" "$RUN_URL" > "$body"
            gh issue comment "$number" --body-file "$body"
            gh issue close "$number" --reason completed
          fi
