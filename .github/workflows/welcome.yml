name: Welcome

# A short, human greeting on a person's first issue or first pull request. It
# does not check out or run any code from the pull request, which is why the
# pull_request_target trigger is safe here: the only thing it can do is post a
# comment with the token's issues/pull-requests write permission.
on:
  issues:
    types: [opened]
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code is run; only posts a comment
    types: [opened]

permissions: {}

jobs:
  greet:
    name: greet first-time contributors
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Thanks for opening your first issue. A bug, an idea, a translation, a docs fix, a data correction: all of it belongs here. You do not need to be sure of the answer; "here is what I tried and where I got stuck" is a complete issue. If it touches the data, add the provider's own page and the day you read it. [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) has the details. We read every issue and reply as soon as we can.
          pr_message: |
            Thanks for your first pull request, and welcome. Tell us what changed and how you checked it; if it touches the data, add the provider's own page and the day you read it. Half-finished is fine: say what is missing. The automatic checks on a first pull request wait for a maintainer to approve them, so there is nothing for you to do. A maintainer may push a small fix to your branch (your authorship stays) if you allow edits. [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) has the details. We read every pull request and reply as soon as we can.
