name: 🔧 Report an outdated or incorrect entry
description: A provider's free tier, limits, or link changed and the dataset is behind.
title: "[outdated] "
labels: ["maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for keeping this accurate — that's the entire value of the project.
        Please point to the provider's **own official docs**, not a third-party summary. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: input
    id: provider
    attributes:
      label: Which provider?
      description: The provider name or its `slug` from data/providers.json (e.g. `groq`, `cloudflare-workers-ai`).
      placeholder: "e.g. Groq"
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong with the current entry?
      placeholder: 'e.g. "The free tier no longer exists" / "Rate limit is now 60 req/min, not 30" / "The docs link 404s"'
    validations:
      required: true
  - type: textarea
    id: correct-info
    attributes:
      label: What's the correct information?
      placeholder: The accurate free tier / limit / credit amount, as best you know it.
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Link to the provider's own official docs confirming this
      description: The primary source, not a third-party summary.
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: checked-date
    attributes:
      label: Date you checked this (YYYY-MM-DD)
      description: Used to set the entry's last_verified date.
      placeholder: "2026-07-30"
    validations:
      required: true
