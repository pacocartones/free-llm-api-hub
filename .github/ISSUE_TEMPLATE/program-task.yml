name: 🏔 Program task (maintainers)
description: For maintainers. A scoped task for Social Winter of Code or a similar program, with its level, files, check and done-when.
title: "<type>: "
body:
  - type: markdown
    attributes:
      value: |
        **For maintainers.** Contributors: please pick an existing task instead (see [Programs](https://github.com/pacocartones/free-llm-api-hub/blob/main/CONTRIBUTING.md#programs-social-winter-of-code-and-similar)). To report wrong data, use the "Report an outdated or incorrect entry" form.

        Write the task so a newcomer can finish it from the issue alone, in the same shape as the good first issues: context, task, how to check, done when, files, size. After opening it, add the program label and the level label from the table in [CONTRIBUTING.md](https://github.com/pacocartones/free-llm-api-hub/blob/main/CONTRIBUTING.md#programs-social-winter-of-code-and-similar), plus `good first issue` only if it meets [every condition](https://github.com/pacocartones/free-llm-api-hub/blob/main/CONTRIBUTING.md#good-first-issues).

        **Choosing the level**
        - **Easy:** one or two files named below, one named check, no third-party account, under about 2 hours for someone new to the repository. Data tasks name the provider and the field.
        - **Medium:** reading existing code or tests, or comparing several official pages; about 2 to 6 hours. Name every file and the check.
        - **Hard:** a design decision, several files, or a re-verification with quotes. Describe the approach to agree in the issue before any code; split it into steps if it is longer than a few days.
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Easy
        - Medium
        - Hard
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters and what exists today, with links to the files or pages at the reviewed commit.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Exactly what to change and what not to change. For data, the provider's own page to read and the field to fill; say that the field stays `null` if the page doesn't answer.
    validations:
      required: true
  - type: textarea
    id: how-to-check
    attributes:
      label: How to check
      description: The commands that must pass, for example `npm run check` for `data/` changes or `npm run build && npm test`, and anything to look at by hand.
      value: |
        ```bash
        npm run check
        ```
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The acceptance criteria a reviewer will check, as observable results.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Every file the change should touch, including regenerated outputs if any.
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size
      placeholder: "Under 1 hour"
    validations:
      required: true
  - type: textarea
    id: footer
    attributes:
      label: For contributors
      description: Keep this text; it ends every program task.
      value: |
        AI-assisted work is welcome and must follow `AI_POLICY.md`: every fact and quote comes from the provider's own page, opened by you. A maintainer adds the level label to the pull request when merging it, only if the pull request closes this issue (`Closes #<this issue>`). To take it, comment `/take` and the bot assigns it to you, as `CONTRIBUTING.md` describes; data tasks labelled `good first issue` and `data` are not assigned.
    validations:
      required: true
